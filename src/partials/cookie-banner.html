<div class="cookie-banner" data-cookie-banner hidden role="region" aria-label="{{t.cookies.label}}">
  <p class="cookie-banner__text">{{t.cookies.text}} <a href="{{url:cookies}}">{{t.cookies.more}}</a></p>
  <div class="cookie-banner__actions">
    <button class="btn btn--primary btn--sm" type="button" data-consent="granted">{{t.cookies.accept}}</button>
    <button class="btn btn--light btn--sm" type="button" data-consent="denied">{{t.cookies.decline}}</button>
  </div>
</div>
