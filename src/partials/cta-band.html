<section class="cta-band">
  <div class="container cta-band__inner">
    <div>
      <p class="cta-band__eyebrow">{{t.cta.ready}}</p>
      <h2 class="cta-band__title">{{t.cta.bandTitle}}</h2>
      <p class="cta-band__text">{{t.cta.bandText}}</p>
    </div>
    <div class="cta-band__actions">
      <a class="btn btn--primary" href="{{url:quote}}">{{t.cta.quote}} <svg class="icon" aria-hidden="true" width="18" height="18"><use href="/images/icons/sprite.svg#arrow-right"></use></svg></a>
      <a class="btn btn--whatsapp" href="{{business.whatsapp.link}}" rel="noopener noreferrer" target="_blank" data-event="whatsapp_click" data-placement="band">
        <svg class="icon" aria-hidden="true" width="20" height="20"><use href="/images/icons/sprite.svg#whatsapp"></use></svg>
        {{t.cta.whatsapp}}
      </a>
    </div>
  </div>
</section>

<section class="contact-strip">
  <div class="container contact-strip__inner">
    <p class="contact-strip__item">
      <svg class="icon" aria-hidden="true" width="24" height="24"><use href="/images/icons/sprite.svg#phone"></use></svg>
      <span><b>{{t.contactStrip.call}}</b><a href="{{business.phone.telLink}}" data-event="tel_click" data-placement="strip"><bdi dir="ltr">{{business.phone.local}}</bdi></a></span>
    </p>
    <p class="contact-strip__item">
      <svg class="icon" aria-hidden="true" width="24" height="24"><use href="/images/icons/sprite.svg#pin"></use></svg>
      <span><b>{{t.contactStrip.location}}</b><span>{{t.footer.location}}</span></span>
    </p>
    <p class="contact-strip__item">
      <svg class="icon" aria-hidden="true" width="24" height="24"><use href="/images/icons/sprite.svg#clock"></use></svg>
      <span><b>{{t.contactStrip.hours}}</b><span>{{hours}}</span></span>
    </p>
  </div>
</section>
