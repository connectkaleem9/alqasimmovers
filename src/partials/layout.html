<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-ga="{{gaId}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{page.canonical}}">
{{hreflang}}
{{robots}}
{{gscMeta}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{business.name.value}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:image" content="{{domain}}/images/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/images/logo/mark-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/images/logo/mark-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/fonts/{{bodyFont}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css?v={{cssVersion}}">
{{schema}}
</head>
<body class="page page--{{page.type}}">
<a class="skip-link" href="#main">{{t.skipToContent}}</a>
{{> topbar}}
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
{{> sticky-cta}}
{{> cookie-banner}}
<script type="module" src="/js/main.js?v={{jsVersion}}"></script>
</body>
</html>
